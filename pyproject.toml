[project]
name = "hads-updater"
version = "0.1.0"
description = "Simple authenticated web app for publishing signed HADS releases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "python-dotenv==1.1.1",
  "itsdangerous==2.2.0",
  "python-multipart==0.0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
